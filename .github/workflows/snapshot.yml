name: Funding snapshot

on:
  schedule:
    - cron: "17 * * * *"   # hourly, at :17
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: funding-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capture snapshot
        run: node scripts/snapshot.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit if changed
        run: |
          git config user.name "lyfher-bot"
          git config user.email "bot@lyfher.xyz"
          git add public/history.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: funding snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
